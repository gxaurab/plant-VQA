model_id: Qwen/Qwen3-VL-2B-Instruct

data:
  train_csv: data/train.csv
  val_csv: data/val.csv
  train_images: data/images/train_images/
  val_images: data/images/val_images/ 

  max_length: 1024
  min_pixels_factor: 128      # min_pixels = factor * 32 * 32
  max_pixels_factor: 256      
  val_limit: 1500             

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: ".*language_model.*(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  output_dir: outputs/qwen3vl-2b-plant-12k
  epochs: 3                   # ceiling; early stopping decides the real number
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  per_device_batch_size: 4    # raise to 8 if VRAM allows
  per_device_eval_batch_size: 4
  grad_accum: 4               # effective batch = 16
  bf16: true
  fp16: false
  gradient_checkpointing: true
  eval_steps: 500
  logging_steps: 25
  save_total_limit: 3
  early_stopping_patience: 3
  num_workers: 8
  seed: 3407

