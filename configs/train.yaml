# model_id: Qwen/Qwen3-VL-2B-Instruct #change path here for offline downloaded model
model_id: /scratch/ptolemy/users/ba974/weedAI/qwen3VL2BInstruct

data:
  train_csv: /scratch/ptolemy/users/ba974/weedAI/plant-VQA/data/train/train.csv
  val_csv: /scratch/ptolemy/users/ba974/weedAI/plant-VQA/data/val/val.csv
  train_images: /scratch/ptolemy/users/ba974/weedAI/plant-VQA/data/train/images/
  val_images: /scratch/ptolemy/users/ba974/weedAI/plant-VQA/data/val/images/ 

  max_length: 1024
  min_pixels_factor: 128      # min_pixels = factor * 32 * 32
  max_pixels_factor: 256      
  val_limit: 1500             

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: ".*language_model.*(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  output_dir: /scratch/ptolemy/users/ba974/weedAI/plant-VQA/outputs/
  epochs: 3                   # ceiling; early stopping decides the real number
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  per_device_batch_size: 4    
  per_device_eval_batch_size: 4
  grad_accum: 4               
  bf16: true
  fp16: false
  gradient_checkpointing: true
  eval_steps: 500
  logging_steps: 25
  save_total_limit: 3
  early_stopping_pat