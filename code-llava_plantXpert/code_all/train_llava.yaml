model_id: llava-hf/llava-1.5-7b-hf

data:
  train_csv: data/train.csv
  val_csv: data/val.csv
  train_images: data/images/train_images/
  val_images: data/images/val_images/

  # LLaVA-1.5 always emits 576 vision tokens (24x24 patches @ 336px).
  # 576 + prompt + answer must fit under max_length. 1024 is comfortable.
  max_length: 1024
  val_limit: 1500

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  # language backbone only; excludes vision_tower and multi_modal_projector
  target_modules: ".*language_model.*(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  output_dir: outputs/llava-1.5-7b-plant-12k
  epochs: 2                   # ceiling; early stopping decides
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  per_device_batch_size: 4    # 7B + 576 img tokens; raise if VRAM allows
  per_device_eval_batch_size: 4
  grad_accum: 4               # effective batch = 16
  bf16: true
  fp16: false
  gradient_checkpointing: true
  eval_steps: 500
  logging_steps: 25
  save_total_limit: 2
  early_stopping_patience: 3
  num_workers: 8
  seed: 3407
